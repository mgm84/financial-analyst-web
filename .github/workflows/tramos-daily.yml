name: Tramos y percentiles diario

on:
  schedule:
    # 06:00 UTC = 08:00 Madrid en horario de verano (CEST).
    # Cuando España pase a horario de invierno (CET, últ. domingo de
    # octubre) esto pasará a correr a las 07:00 Madrid. Si quieres que
    # se mantenga siempre a las 08:00 Madrid, hay que cambiar este
    # cron a mano dos veces al año (GitHub Actions no ajusta DST).
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas numpy yfinance

      - name: Monitor de tramos
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python monitor_tramos_scheduled.py

      - name: Screen de percentiles
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python screen_percentiles_scheduled.py

      - name: Refresco de precios y rendimientos
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python refresh_market_data.py

      - name: Cálculo de patrimonio (total / IA / Equity)
        run: python compute_patrimonio.py

      # NUEVO (2026-10-27): renderiza aquí, en CI (entorno de confianza),
      # el HTML base de los correos diario y semanal -- todo lo que NO
      # depende de la investigación de la tarea programada de Claude
      # (KPIs, tablas de performance, Puerta 1, Puerta 2, pie de página).
      # Sin --content, build_emails_prod.py usa content={} y renderiza
      # los dos placeholders neutros de siempre ("Sin noticia relevante
      # específica de la cartera identificada hoy." / mismo para
      # "esta semana" / Puerta 3 "sin activar" con el texto por defecto).
      # La tarea programada de Claude descarga estos 3 ficheros como
      # DATOS (nunca los ejecuta) y sustituye esos dos placeholders por
      # la noticia real y el estado real de Puerta 3 que investiga cada
      # día por WebSearch, antes de enviar el correo. Esto evita que el
      # sandbox de Claude tenga que ejecutar código bajado de internet
      # (bloqueado por una restricción de plataforma, ver
      # claude/automatizacion-tramos-percentiles.md).
      - name: Render base del correo (sin noticias ni Puerta 3)
        run: |
          mkdir -p data/email
          python scripts/build_emails_prod.py --data-dir data --out-dir data/email --weekly

      - name: Commit resultado
        run: |
          git config user.name "tramos-bot"
          git config user.email "tramos-bot@users.noreply.github.com"
          git add data/tramos_status.json data/percentiles.json data/market_data.json data/patrimonio.json data/email/daily.html data/email/weekly.html data/email/meta.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "Actualización diaria tramos/percentiles/mercado/patrimonio/correo-base $(date -u +%Y-%m-%d)"
          git push
